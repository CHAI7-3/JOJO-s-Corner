<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JOJO的小站</title>
<style>
  /* ===== 颜色：想换风格，改这里就行 ===== */
  :root {
    --bg1: #fff5f8;            /* 最浅的粉 */
    --bg2: #f7f0fb;            /* 邻近色：浅浅的丁香紫 */
    --ink: #3a2f3d;
    --muted: #7d6f82;
    --card: #ffffff;
    --line: rgba(120, 70, 110, .16);
    --shadow: rgba(120, 70, 110, .12);
    --up: #d94f68;
    --down: #2f9d86;
    --ribbon: linear-gradient(90deg, #e8445a, #f28a3c, #f2d04a, #4fb6a0, #4a8fd8, #8a5cc7);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #261d28; --bg2: #1f1b2c; --ink: #f6eef2; --muted: #bfb1c6; --card: #33293b;
      --line: rgba(255,255,255,.14); --shadow: rgba(0,0,0,.4); --up: #ff7a90; --down: #5fd1b8;
    }
  }
  :root[data-theme="dark"] {
    --bg1: #261d28; --bg2: #1f1b2c; --ink: #f6eef2; --muted: #bfb1c6; --card: #33293b;
    --line: rgba(255,255,255,.14); --shadow: rgba(0,0,0,.4); --up: #ff7a90; --down: #5fd1b8;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg1); }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px 88px; }
  button, input { font: inherit; color: inherit; }
  button:focus-visible, figure:focus-visible, input:focus-visible { outline: 3px solid #4a8fd8; outline-offset: 3px; }

  /* ===== 顶部控制区：语言 / 深色模式 / 音乐 ===== */
  .bar { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; padding: 18px 0 0; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--card); border-radius: 999px; padding: 3px; box-shadow: 0 2px 10px var(--shadow); }
  .seg button { font-size: 14px; color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 5px 14px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg1); }
  .chip { font-size: 14px; background: var(--card); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; box-shadow: 0 2px 10px var(--shadow); }
  .chip.icon { padding: 8px 12px; }

  /* ===== 标题 ===== */
  .head { padding: 40px 0 8px; }
  h1 { font-family: "Didot", "Bodoni 72", "Playfair Display", "Noto Serif", Georgia, serif; font-weight: 600;
       font-size: clamp(68px, 15vw, 150px); line-height: 1; margin: 0; letter-spacing: .06em; display: inline-block; }
  .ribbon { height: 10px; border-radius: 10px; background: var(--ribbon); margin: 14px 0 22px; }
  .intro { color: var(--muted); font-size: 19px; max-width: 30em; margin: 0 0 6px; }
  .hint { color: var(--muted); font-size: 15px; margin: 0; opacity: .85; }

  /* ===== 摸摸 JOJO ===== */
  .pet { display: flex; align-items: center; justify-content: center; gap: 8px 20px; flex-wrap: wrap; margin-top: 28px; background: var(--card); border-radius: 24px; padding: 16px 22px; box-shadow: 0 10px 30px var(--shadow); }
  .paw { font-size: 34px; line-height: 1; }
  .btn { font-size: 16px; color: var(--bg1); background: var(--ink); border: 0; border-radius: 999px; padding: 11px 26px; cursor: pointer; }
  .btn:hover { background: #e8445a; color: #fff; }
  .count { margin: 0; color: var(--muted); font-size: 15px; min-height: 1.7em; min-width: 9em; }

  /* ===== 拼贴照片 ===== */
  .collage { display: grid; grid-template-columns: repeat(12, 1fr); gap: 28px 22px; align-items: start; padding: 36px 0 8px; }
  .ph { margin: 0; background: var(--card); padding: 10px 10px 0; border-radius: 10px; box-shadow: 0 10px 30px var(--shadow); cursor: pointer; transform: rotate(var(--r, 0deg)); transition: transform .2s ease; }
  .ph:hover { transform: rotate(0deg) translateY(-4px); }
  .ph img { width: 100%; display: block; border-radius: 6px; }
  .ph figcaption { padding: 10px 6px 14px; font-size: 15px; color: var(--muted); }
  .p3 { grid-column: 1 / 8;  grid-row: 1;          --r: -1.2deg; }
  .p1 { grid-column: 8 / 13; grid-row: 1 / span 2; --r: 1.8deg; margin-top: 36px; }
  .p4 { grid-column: 5 / 8;  grid-row: 2;          --r: -2deg;  margin-top: 20px; }
  .p2 { grid-column: 1 / 5;  grid-row: 2;          --r: 1.2deg; }
  .p5 { grid-column: 4 / 12; grid-row: 3;          --r: -1deg; }

  /* ===== 小工具（三个标签页） ===== */
  .tools { margin-top: 72px; background: var(--card); border-radius: 28px; padding: 28px; box-shadow: 0 10px 30px var(--shadow); }
  .tabs { margin-bottom: 26px; background: var(--bg1); box-shadow: none; }
  .tabs button { padding: 7px 18px; }
  .panel[hidden] { display: none; }

  .w-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .w-big { font-family: "Didot", "Bodoni 72", Georgia, serif; font-size: 46px; line-height: 1.1; font-weight: 600; }
  .w-sub { color: var(--muted); font-size: 15px; }
  .w-sub .up { color: var(--up); } .w-sub .down { color: var(--down); }
  .w-treat { color: var(--muted); font-size: 15px; }
  .chart { margin: 18px 0 6px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .w-msg { min-height: 2.8em; margin: 8px 0 14px; font-size: 17px; }
  .w-msg.up { color: var(--up); } .w-msg.down { color: var(--down); }
  .w-form { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .w-form label { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); gap: 4px; }
  .w-form input { background: var(--bg1); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--ink); min-width: 150px; }
  .link { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; padding: 10px 0 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chips button { background: var(--bg1); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-size: 15px; }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg1); border-color: var(--ink); }
  .bubble { margin-top: 24px; min-height: 120px; display: flex; align-items: center; gap: 18px; background: var(--bg1); border-radius: 22px; padding: 22px 24px; }
  .bubble .em { font-size: 52px; line-height: 1; }
  .bubble p { margin: 0; font-size: clamp(18px, 2.8vw, 24px); }

  .g-top { display: flex; gap: 24px; flex-wrap: wrap; color: var(--muted); font-size: 15px; margin-bottom: 12px; }
  .g-top b { color: var(--ink); font-size: 18px; }
  .arena { position: relative; height: 340px; background: var(--bg1); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; transition: border-color .2s; }
  .arena.hit { border-color: var(--up); }
  .arena canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; display: block; }
  .g-over[hidden] { display: none; }
  .g-over { z-index: 2; position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 16px; }
  .g-over p { margin: 0; color: var(--muted); }

  /* ===== 点击动画 ===== */
  .pop { position: fixed; pointer-events: none; font-size: 26px; z-index: 50; animation: pop .9s ease-out forwards; }
  @keyframes pop { from { opacity: 1; transform: translate(0, 0) scale(.6); } to { opacity: 0; transform: translate(var(--dx), -90px) scale(1.2); } }
  .wiggle { animation: wiggle .5s ease; }
  @keyframes wiggle { 0%,100% { transform: rotate(var(--r, 0deg)); } 25% { transform: rotate(-4deg) scale(1.03); } 50% { transform: rotate(4deg) scale(1.03); } 75% { transform: rotate(-2deg); } }
  @media (prefers-reduced-motion: reduce) { .wiggle, .ph { animation: none; transition: none; } }

  @media (max-width: 760px) {
    .collage { grid-template-columns: 1fr 1fr; gap: 22px 14px; }
    .p3 { grid-column: 1 / -1; grid-row: auto; }
    .p1 { grid-column: 1 / 2; grid-row: auto; margin-top: 0; }
    .p4 { grid-column: 2 / 3; grid-row: auto; margin-top: 28px; }
    .p2, .p5 { grid-column: 1 / -1; grid-row: auto; }
    .head { padding-top: 24px; }
    .tools { padding: 20px 16px; margin-top: 48px; }
    .bubble { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>

  <div class="bar">
    <div class="row">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="zh" aria-pressed="true">中文</button>

        <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      </div>
      <button type="button" class="chip" id="themeBtn"></button>

  // 喵：声带（锯齿波 + 颤音）经过三个共振峰，从 "咪(mi)" 滑向 "嗷(ao)"，音高先升后降，每次略有不同

    const src = a.createOscillator(); src.type = "sawtooth";

  }

  // 呼噜：约 25 次/秒的喉部脉冲，低频嗡鸣 + 噪声，随呼吸一起一伏
  function purr() {
    const a = ctx(); if (!a) return;

    const t = a.currentTime;
    const out = a.createGain();

    out.gain.exponentialRampToValueAtTime(1, t + 0.35);
    out.gain.setValueAtTime(1, t + dur - 0.6);
    out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    out.connect(comp);
    const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 800; lp.connect(out);
    const pulse = a.createGain(); pulse.gain.value = 0.02; pulse.connect(lp);
    const ns = a.createBufferSource(); ns.buffer = noiseBuf(a, dur + 0.1);
    const nb = a.createBiquadFilter(); nb.type = "bandpass"; nb.frequency.value = 240; nb.Q.value = 0.8;
    const ng = a.createGain(); ng.gain.value = 10;

  }

  function swoosh(low) {                 // 划过的"嗖"声

    s.connect(f); f.connect(gn); gn.connect(comp); s.start(t); s.stop(t + 0.2);
  }

  function chartSVG(list) {
    const W = 640, H = 250, L = 46, R = 28, T = 34, B = 46;
    const ts = list.map(function (e) { return new Date(e.d).getTime(); });
    const ws = list.map(function (e) { return e.w; });
    const t0 = Math.min.apply(null, ts), t1 = Math.max.apply(null, ts);
    const lo = Math.floor((Math.min.apply(null, ws) - 0.2) * 10) / 10, hi = Math.ceil((Math.max.apply(null, ws) + 0.2) * 10) / 10;
    const X = function (t) { return t1 === t0 ? (L + W - R) / 2 : L + (t - t0) / (t1 - t0) * (W - L - R); };
    const Y = function (v) { return T + (hi - v) / (hi - lo) * (H - T - B); };
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + I18N[lang].wChart + '" font-size="13">';
    for (let i = 0; i <= 3; i++) {

      s += '<text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end" fill="var(--muted)">' + v.toFixed(1) + '</text>';

    const every = list.length <= 6;

  function renderWeight() {
    const t = I18N[lang], list = allWeights(), last = list[list.length - 1];
    $("wBig").textContent = last.w.toFixed(2) + " kg";
    let sub = t.wLatest + " · " + fmtDate(last.d);
    if (list.length > 1) {
      const prev = list[list.length - 2], diff = Math.round((last.w - prev.w) * 100) / 100;
      if (diff !== 0) {
        sub += ' · <span class="' + (diff > 0 ? "up" : "down") + '">' + (diff > 0 ? "↑ +" : "↓ −") + Math.abs(diff).toFixed(2) + " kg</span> " + t.wVs + " " + fmtDate(prev.d);
      }
    }
    $("wSub").innerHTML = sub;
    const n = treats(list);
    $("wTreat").textContent = n > 0 ? fill(t.wTreat, { n: n }) : "";
    $("chart").innerHTML = chartSVG(list);
    $("wUndo").hidden = extra.length === 0;
    renderMsg();
  }
  function persist() {
    const json = JSON.stringify(extra);
    save("jojo_weights", json);
    if (storeRef) storeRef.set({ entries: extra }).catch(function () {});
  }
  $("wAdd").addEventListener("click", function () {
    const d = $("wDateIn").value, w = parseFloat($("wKgIn").value);
    if (!d || !(w >= 1 && w <= 15)) { msg = { k: "wBad", p: {}, cls: "" }; renderMsg(); return; }
    const entry = { d: d, w: Math.round(w * 100) / 100 };
    extra.push(entry);
    const list = allWeights(), idx = list.indexOf(entry) >= 0 ? list.indexOf(entry) : list.findIndex(function (e) { return e.d === entry.d && e.w === entry.w; });
    const prev = idx > 0 ? list[idx - 1] : null;
    const r = $("wAdd").getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top;
    if (!prev) { msg = { k: "wFirst", p: { w: entry.w.toFixed(2) }, cls: "" }; }
    else {
      const diff = Math.round((entry.w - prev.w) * 100) / 100, p = { w: entry.w.toFixed(2), d: Math.abs(diff).toFixed(2) };
      if (diff > 0) { msg = { k: "wUp", p: p, cls: "up" }; burst(cx, cy, 4, ["🙀", "😾", "😿"]); }
      else if (diff < 0) { msg = { k: "wDown", p: p, cls: "down" }; burst(cx, cy, 8, ["🍗", "😻", "🍗", "😽"]); meow(); }
      else msg = { k: "wSame", p: p, cls: "" };
    }
    persist(); renderWeight(); $("wKgIn").value = "";
  });
  $("wUndo").addEventListener("click", function () { extra.pop(); msg = null; persist(); renderWeight(); });

  /* ================= JOJO 在干嘛呢 ================= */
  let doingK = -1, doingEm = "🐾";   // doingK：把"状态"和"猫语"接在一起的序号
  function renderDoing() {
    const t = I18N[lang], box = $("chips"), n = t.states.length + t.sayings.length;
    box.innerHTML = "";
    t.states.forEach(function (s, i) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = s.e + " " + s.t; b.setAttribute("aria-pressed", String(i === doingK));
      b.addEventListener("click", function (ev) { doingK = i; doingEm = s.e; renderDoing(); burst(ev.clientX, ev.clientY, 2); });
      box.appendChild(b);
    });
    const r = document.createElement("button");
    r.type = "button"; r.textContent = t.dRand; r.setAttribute("aria-pressed", "false");
    r.addEventListener("click", function (ev) {
      let k; do { k = Math.floor(Math.random() * n); } while (k === doingK);
      doingK = k;
      doingEm = k < t.states.length ? t.states[k].e : EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
      renderDoing(); burst(ev.clientX, ev.clientY, 2);
    });
    box.appendChild(r);
    $("dEm").textContent = doingK >= 0 ? doingEm : "🐾";
    $("dLine").textContent = doingK < 0 ? t.dHint : (doingK < t.states.length ? t.states[doingK].s : t.sayings[doingK - t.states.length]);
  }

  /* ================= 捕捉彩带（切水果式小游戏） ================= */
  const cv = $("cv"), cx = cv.getContext("2d");
  const RIB = ["#e8445a", "#f28a3c", "#f2d04a", "#4fb6a0", "#4a8fd8", "#8a5cc7"];   // 照片里彩带的颜色，从红到紫
  const g = { on: false, over: false, score: 0, t: GAME_SECONDS, best: parseInt(load("jojo_best") || "0", 10) || 0,
              W: 0, H: 0, objs: [], halves: [], bits: [], trail: [], pt: null, down: false, raf: 0, t0: 0, last: 0, nextSpawn: 0, ink: "#3a2f3d" };

  function gameUI() { $("gScore").textContent = g.score; $("gTime").textContent = g.t; $("gBest").textContent = g.best; }
  function sizeCanvas() {
    const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    g.W = r.width; g.H = r.height; cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
    cx.setTransform(d, 0, 0, d, 0, 0);
  }
  function showOver() {
    const t = I18N[lang];
    $("gMsg").textContent = g.over ? fill(t.gEnd, { n: g.score }) : fill(t.gIntro, { s: GAME_SECONDS });
    $("gStart").textContent = g.over ? t.gAgain : t.gStart;
    if (!g.on) $("gOver").hidden = false;
  }

  function ribbonPath(len, wid, ph) {                       // 一条会随风飘动的缎带
    const n = 18, top = [], bot = [];
    for (let i = 0; i <= n; i++) {
      const u = i / n, x = (u - 0.5) * len, y = Math.sin(u * Math.PI * 2.2 + ph) * wid * 0.55;
      const w = wid * (0.55 + 0.45 * Math.sin(Math.PI * u)) / 2;
      top.push([x, y - w]); bot.push([x, y + w]);
    }
    cx.beginPath(); cx.moveTo(top[0][0], top[0][1]);
    for (let i = 1; i <= n; i++) cx.lineTo(top[i][0], top[i][1]);
    for (let i = n; i >= 0; i--) cx.lineTo(bot[i][0], bot[i][1]);
    cx.closePath();
  }
  function drawObj(o, alpha) {
    cx.save(); cx.globalAlpha = alpha == null ? 1 : alpha; cx.translate(o.x, o.y); cx.rotate(o.r);
    if (o.half) { cx.beginPath(); cx.rect(o.half < 0 ? -300 : 0, -300, 300, 600); cx.clip(); }
    if (o.type === "bird") {
      cx.font = "42px 'Apple Color Emoji','Segoe UI Emoji',sans-serif"; cx.textAlign = "center"; cx.textBaseline = "middle";
      cx.fillText("🐦", 0, 0);
    } else {
      ribbonPath(o.len, o.wid, o.ph);
      const gr = cx.createLinearGradient(-o.len / 2, 0, o.len / 2, 0);
      RIB.forEach(function (c, i) { gr.addColorStop(i / (RIB.length - 1), c); });
      cx.fillStyle = gr; cx.fill();
      cx.globalAlpha *= 0.55; cx.strokeStyle = "#ffffff"; cx.lineWidth = 1.5; cx.stroke();
    }
    cx.restore();
  }

  function spawn() {
    const n = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const bird = Math.random() < 0.22, x = g.W * (0.15 + Math.random() * 0.7), gv = g.H * 2.0, h = g.H * (0.55 + Math.random() * 0.35);
      g.objs.push({
        type: bird ? "bird" : "rib", x: x, y: g.H + 30,
        vx: (g.W / 2 - x) * 0.35 + (Math.random() - 0.5) * g.W * 0.12, vy: -Math.sqrt(2 * gv * h), gv: gv,
        r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 5, ph: Math.random() * 6,
        len: Math.min(130, g.W * 0.24) * (0.9 + Math.random() * 0.25), wid: 26
      });
    }
  }
  function segDist(px, py, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, l = dx * dx + dy * dy;
    let u = l ? ((px - a.x) * dx + (py - a.y) * dy) / l : 0; u = Math.max(0, Math.min(1, u));
    const x = a.x + u * dx - px, y = a.y + u * dy - py; return Math.sqrt(x * x + y * y);
  }
  function sliceObj(o, a, b) {
    g.objs.splice(g.objs.indexOf(o), 1);
    const dx = b.x - a.x, dy = b.y - a.y, l = Math.sqrt(dx * dx + dy * dy) || 1, px = -dy / l, py = dx / l;
    [-1, 1].forEach(function (h) {
      g.halves.push({ type: o.type, half: h, x: o.x, y: o.y, vx: o.vx + h * px * 140, vy: o.vy + h * py * 140 - 40, gv: o.gv,
                      r: o.r, vr: o.vr + h * 2.5, ph: o.ph, len: o.len, wid: o.wid, a: 1 });
    });
    for (let i = 0; i < 9; i++) {
      const ang = Math.random() * 6.28, sp = 80 + Math.random() * 160;
      g.bits.push({ x: o.x, y: o.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 60, life: 0.55, col: o.type === "bird" ? "#9a8f9e" : RIB[Math.floor(Math.random() * RIB.length)] });
    }
    if (o.type === "bird") {
      g.score = Math.max(0, g.score - 1); swoosh(true);
      $("arena").classList.add("hit"); setTimeout(function () { $("arena").classList.remove("hit"); }, 300);
    } else { g.score += 1; swoosh(false); }
    gameUI();
  }
  function cutSeg(a, b) {
    if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) < 2) return;
    g.objs.slice().forEach(function (o) {
      if (segDist(o.x, o.y, a, b) < (o.type === "bird" ? 28 : o.len * 0.42)) sliceObj(o, a, b);
    });
  }

  function frame(now) {
    if (!g.on) return;
    const dt = Math.min(0.033, (now - g.last) / 1000); g.last = now;
    const left = GAME_SECONDS - (now - g.t0) / 1000, tl = Math.max(0, Math.ceil(left));
    if (tl !== g.t) { g.t = tl; gameUI(); }
    if (left <= 0) { endGame(); return; }
    if (now >= g.nextSpawn) { spawn(); g.nextSpawn = now + 600 + Math.random() * 500; }
    g.objs.forEach(function (o) { o.vy += o.gv * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.r += o.vr * dt; o.ph += dt * 5; });
    g.objs = g.objs.filter(function (o) { return !(o.y > g.H + 70 && o.vy > 0); });
    g.halves.forEach(function (o) { o.vy += o.gv * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.r += o.vr * dt; o.ph += dt * 5; o.a -= dt * 0.9; });
    g.halves = g.halves.filter(function (o) { return o.a > 0 && o.y < g.H + 90; });
    g.bits.forEach(function (b) { b.vy += 900 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; });
    g.bits = g.bits.filter(function (b) { return b.life > 0; });

    cx.clearRect(0, 0, g.W, g.H);
    g.objs.forEach(function (o) { drawObj(o); });
    g.halves.forEach(function (o) { drawObj(o, Math.max(0, o.a)); });
    g.bits.forEach(function (b) { cx.globalAlpha = Math.max(0, b.life / 0.55); cx.fillStyle = b.col; cx.beginPath(); cx.arc(b.x, b.y, 3, 0, 6.28); cx.fill(); });
    cx.globalAlpha = 1;
    const tn = performance.now(); g.trail = g.trail.filter(function (p) { return tn - p.t < 260; });
    cx.strokeStyle = g.ink; cx.lineCap = "round";
    for (let i = 1; i < g.trail.length; i++) {
      const life = 1 - (tn - g.trail[i].t) / 260;
      cx.globalAlpha = 0.75 * life; cx.lineWidth = 2 + 5 * life;
      cx.beginPath(); cx.moveTo(g.trail[i - 1].x, g.trail[i - 1].y); cx.lineTo(g.trail[i].x, g.trail[i].y); cx.stroke();
    }
    cx.globalAlpha = 1;
    g.raf = requestAnimationFrame(frame);
  }
  function endGame() {
    g.on = false; cancelAnimationFrame(g.raf); cx.clearRect(0, 0, g.W, g.H);
    if (g.score > g.best) { g.best = g.score; save("jojo_best", String(g.best)); }
    g.over = true; gameUI(); showOver();
  }
  function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  cv.addEventListener("pointerdown", function (e) {
    if (!g.on) return;
    g.down = true; try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    g.pt = pos(e); g.trail.push({ x: g.pt.x, y: g.pt.y, t: performance.now() });
  });
  cv.addEventListener("pointermove", function (e) {
    if (!g.on || !g.down) return;
    const p = pos(e); if (g.pt) cutSeg(g.pt, p);
    g.trail.push({ x: p.x, y: p.y, t: performance.now() }); g.pt = p;
  });
  ["pointerup", "pointercancel"].forEach(function (ev) { cv.addEventListener(ev, function () { g.down = false; g.pt = null; }); });
  $("gStart").addEventListener("click", function () {
    $("gOver").hidden = true; sizeCanvas();
    g.score = 0; g.t = GAME_SECONDS; g.objs = []; g.halves = []; g.bits = []; g.trail = []; g.pt = null; g.down = false;
    g.ink = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#3a2f3d";
    g.on = true; g.t0 = performance.now(); g.last = g.t0; g.nextSpawn = g.t0 + 300;
    gameUI(); g.raf = requestAnimationFrame(frame);
  });

  /* ================= 语言 / 深色模式 ================= */
  function applyTheme() {
    const dark = isDark();
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    $("themeBtn").textContent = dark ? I18N[lang].light : I18N[lang].dark;
  }
  function applyLang() {
    const t = I18N[lang];
    document.documentElement.lang = t.htmlLang;
    document.title = t.title;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t[el.dataset.i18n]; });
    document.querySelectorAll("[data-alt]").forEach(function (el) { el.alt = t[el.dataset.alt]; });
    document.querySelectorAll("[data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
    applyTheme(); musicLabel(); renderCount(); renderWeight(); renderDoing(); gameUI();
    if (!g.on) showOver();
  }
  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.addEventListener("click", function () { lang = b.dataset.lang; save("lang", lang); applyLang(); });
  });
  $("themeBtn").addEventListener("click", function () { theme = isDark() ? "light" : "dark"; save("theme", theme); applyTheme(); });

  /* ================= 启动：读取已保存的体重 ================= */
  (function init() {
    const t = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
    $("wDateIn").value = t.getFullYear() + "-" + p(t.getMonth() + 1) + "-" + p(t.getDate());
    try { extra = JSON.parse(load("jojo_weights") || "[]") || []; } catch (e) { extra = []; }
    applyLang();
    // 如果页面支持在线保存，就优先使用在线保存（换设备也能看到）
    if (typeof claude !== "undefined" && claude && claude.use) {
      Promise.all([claude.use("db"), claude.use("user")]).then(function (r) {
        const db = r[0], user = r[1];
        if (!db || !user || !user.id) return null;
        return user.id().then(function (id) {
          if (!id) return null;
          storeRef = db.doc("data/users/" + id + "/weights");
          return storeRef.get().then(function (snap) {
            if (snap.exists && snap.data() && Array.isArray(snap.data().entries)) { extra = snap.data().entries; renderWeight(); }
            else if (extra.length) storeRef.set({ entries: extra }).catch(function () {});
          });
        });
      }).catch(function () {});
    }
  })();
</script>
</body>
